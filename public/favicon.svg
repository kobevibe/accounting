<svg xmlns="http://www.w3.org/2000/svg" width="128" height="128" viewBox="0 0 128 128">
  <defs>
    <linearGradient id="silver" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="40%" stop-color="#cfd8dc"/>
      <stop offset="100%" stop-color="#78909c"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="1" dy="2" stdDeviation="1.5" flood-color="#000000" flood-opacity="0.6"/>
    </filter>
  </defs>
  <!-- Dark Navy Rounded Square Background -->
  <rect width="128" height="128" rx="28" fill="#101b2d"/>
  <!-- Inner subtle border -->
  <rect x="2" y="2" width="124" height="124" rx="26" fill="none" stroke="#ffffff" stroke-opacity="0.08" stroke-width="2"/>
  
  <!-- PACG 2x2 Serif Letters -->
  <text x="36" y="54" font-family="Georgia, Playfair Display, serif" font-size="44" font-weight="700" fill="url(#silver)" filter="url(#shadow)" text-anchor="middle">P</text>
  <text x="92" y="54" font-family="Georgia, Playfair Display, serif" font-size="44" font-weight="700" fill="url(#silver)" filter="url(#shadow)" text-anchor="middle">A</text>
  <text x="36" y="106" font-family="Georgia, Playfair Display, serif" font-size="44" font-weight="700" fill="url(#silver)" filter="url(#shadow)" text-anchor="middle">C</text>
  <text x="92" y="106" font-family="Georgia, Playfair Display, serif" font-size="44" font-weight="700" fill="url(#silver)" filter="url(#shadow)" text-anchor="middle">G</text>
</svg>
