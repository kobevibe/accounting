<svg xmlns="http://www.w3.org/2000/svg" width="128" height="128" viewBox="0 0 128 128">
  <defs>
    <linearGradient id="silver" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="35%" stop-color="#e0e0e0"/>
      <stop offset="70%" stop-color="#90a4ae"/>
      <stop offset="100%" stop-color="#546e7a"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="1" dy="2.5" stdDeviation="1" flood-color="#000000" flood-opacity="0.7"/>
    </filter>
  </defs>
  <!-- Dark Navy Blue Rounded Square App Icon Background -->
  <rect width="128" height="128" rx="28" fill="#0d1b2a"/>
  <!-- Subtle inner border bezel -->
  <rect x="2" y="2" width="124" height="124" rx="26" fill="none" stroke="#ffffff" stroke-opacity="0.12" stroke-width="2"/>
  
  <!-- 2x2 Grid Layout for PACG -->
  <text x="38" y="52" font-family="Georgia, serif" font-size="52" font-weight="700" fill="url(#silver)" filter="url(#shadow)" text-anchor="middle">P</text>
  <text x="90" y="52" font-family="Georgia, serif" font-size="52" font-weight="700" fill="url(#silver)" filter="url(#shadow)" text-anchor="middle">A</text>
  <text x="38" y="104" font-family="Georgia, serif" font-size="52" font-weight="700" fill="url(#silver)" filter="url(#shadow)" text-anchor="middle">C</text>
  <text x="90" y="104" font-family="Georgia, serif" font-size="52" font-weight="700" fill="url(#silver)" filter="url(#shadow)" text-anchor="middle">G</text>
</svg>
